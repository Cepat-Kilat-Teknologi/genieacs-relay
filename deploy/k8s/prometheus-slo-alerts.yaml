apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: genieacs-relay-slo-alerts
  namespace: genieacs-relay
  labels:
    app: genieacs-relay
    prometheus: kube-prometheus
    role: slo-alerts
spec:
  groups:
    - name: genieacs-relay.slo.alerts
      rules:
        # ── Fast burn: 2% of 30-day error budget consumed in 1h ──
        # Burn rate 14.4x over 1h → pages on-call immediately.
        - alert: genieacs-relay_SLOFastBurn
          expr: |
            genieacs_relay:error_budget_burn:rate1h > 14.4
            and
            (
              sum(rate(http_requests_total{job="genieacs-relay", status=~"5.."}[5m]))
              /
              sum(rate(http_requests_total{job="genieacs-relay"}[5m]))
            ) / (1 - 0.999) > 14.4
          for: 2m
          labels:
            severity: critical
            service: genieacs-relay
            slo: availability
          annotations:
            summary: "genieacs-relay SLO fast burn — error budget depleting rapidly"
            description: "1h burn rate {{ $value }}x (threshold 14.4x). At this rate, the 30-day error budget is exhausted in {{ $value | humanize }}h."

        # ── Slow burn: 5% of 30-day error budget consumed in 6h ──
        # Burn rate 6x over 6h → creates a ticket for investigation.
        - alert: genieacs-relay_SLOSlowBurn
          expr: |
            (
              sum(rate(http_requests_total{job="genieacs-relay", status=~"5.."}[6h]))
              /
              sum(rate(http_requests_total{job="genieacs-relay"}[6h]))
            ) / (1 - 0.999) > 6
            and
            genieacs_relay:error_budget_burn:rate1h > 3
          for: 15m
          labels:
            severity: warning
            service: genieacs-relay
            slo: availability
          annotations:
            summary: "genieacs-relay SLO slow burn — error budget eroding"
            description: "6h burn rate exceeds 6x threshold. Investigate elevated error rate before budget exhaustion."

        # ── Availability below SLO target over 1h ────────────────
        - alert: genieacs-relay_AvailabilityBelowSLO
          expr: genieacs_relay:availability:rate1h < 0.999
          for: 10m
          labels:
            severity: warning
            service: genieacs-relay
            slo: availability
          annotations:
            summary: "genieacs-relay availability below 99.9% SLO"
            description: "1h availability is {{ $value | humanizePercentage }} (target: 99.9%)."

        # ── Latency SLO breach (p99 > 500ms) ────────────────────
        - alert: genieacs-relay_LatencyP99AboveSLO
          expr: genieacs_relay:latency_p99:rate5m > 0.5
          for: 10m
          labels:
            severity: warning
            service: genieacs-relay
            slo: latency
          annotations:
            summary: "genieacs-relay p99 latency above 500ms SLO"
            description: "p99 latency is {{ $value | humanizeDuration }} (target: <500ms)."

        # ── Error budget exhausted (30-day window) ───────────────
        - alert: genieacs-relay_ErrorBudgetExhausted
          expr: genieacs_relay:availability:rate24h < 0.999
          for: 1h
          labels:
            severity: critical
            service: genieacs-relay
            slo: availability
          annotations:
            summary: "genieacs-relay error budget exhausted"
            description: "24h availability {{ $value | humanizePercentage }} is below the 99.9% SLO. Freeze non-critical deployments."
